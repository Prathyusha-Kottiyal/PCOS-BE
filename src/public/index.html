<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Akam Yoga Studio</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #f6f3ee, #efe9df);
      color: #3a3a3a;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 40px 24px;
      max-width: 500px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .tagline {
      font-size: 16px;
      margin-bottom: 32px;
      color: #6b6b6b;
    }

    .coming {
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 24px;
      color: #8a7f6a;
    }

    .divider {
      width: 60px;
      height: 1px;
      background: #c8bfae;
      margin: 0 auto 24px;
    }

    .contact {
      font-size: 14px;
      color: #5a5a5a;
    }

    .contact a {
      color: #5a5a5a;
      text-decoration: none;
      border-bottom: 1px solid #c8bfae;
      padding-bottom: 2px;
    }

    .contact a:hover {
      color: #000;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Akam Yoga Studio</h1>
    <div class="tagline">Returning to the self, one breath at a time</div>

    <div class="divider"></div>

    <div class="coming"> Coming Soon</div>

    <!-- <div class="contact">
      Follow us on <a href="#" target="_blank">Instagram</a>
      <br/><br/>
      Contact: hello@akamyogastudio.com
    </div> -->
  </div>

</body>
</html>
